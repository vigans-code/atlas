name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
      - name: Build source archive and checksum
        run: |
          version=$(tr -d '\r\n' < VERSION)
          git archive --format=zip --output="atlas-${version}-source.zip" HEAD
          sha256sum "atlas-${version}-source.zip" > "atlas-${version}-source.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: atlas-*-source.zip*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run desktop:package
        working-directory: frontend
      - name: Create installer checksum
        shell: pwsh
        run: Get-ChildItem frontend/release/Atlas-Setup-*.exe | ForEach-Object { (Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant() + "  " + $_.Name | Set-Content ($_.FullName + ".sha256") }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            frontend/release/Atlas-Setup-*.exe
            frontend/release/Atlas-Setup-*.exe.sha256

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
          - name: model
            context: model
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/atlas-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/atlas-${{ matrix.name }}:latest

  publish:
    runs-on: ubuntu-latest
    needs: [source, windows, images]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
