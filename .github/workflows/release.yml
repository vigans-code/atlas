name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
      - name: Build source archive and checksum
        run: |
          version=$(tr -d '\r\n' < VERSION)
          git archive --format=zip --output="atlas-${version}-source.zip" HEAD
          sha256sum "atlas-${version}-source.zip" > "atlas-${version}-source.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: atlas-*-source.zip*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Prepare standalone Atlas Native packager
        shell: pwsh
        run: |
          python -m venv model/.venv
          model/.venv/Scripts/python.exe -m pip install --upgrade pip
          model/.venv/Scripts/python.exe -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.5,<3.0"
          model/.venv/Scripts/python.exe -m pip install -e "./model[package]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run desktop:package
        working-directory: frontend
      - name: Create installer checksum
        shell: pwsh
        run: Get-ChildItem frontend/release/Atlas-Setup-*.exe | ForEach-Object { (Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant() + "  " + $_.Name | Set-Content ($_.FullName + ".sha256") }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            frontend/release/Atlas-Setup-*.exe
            frontend/release/Atlas-Setup-*.exe.sha256

  publish:
    runs-on: ubuntu-latest
    needs: [source, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
