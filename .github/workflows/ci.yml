name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ATLAS_SECRET_KEY: atlas-ci-secret-with-at-least-thirty-two-characters
      ATLAS_DATABASE_URL: postgresql+asyncpg://atlas:atlas-ci-password@localhost:5432/atlas
      ATLAS_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: ruff check app tests
        working-directory: backend
      - run: ruff format --check app tests
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npm run test:security
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  native-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: model
      - run: ruff check atlas_model tests
        working-directory: model
      - run: ruff format --check atlas_model tests
        working-directory: model
      - run: pytest -q
        working-directory: model

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.production.example .env
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose --env-file .env.production.example -f compose.release.yaml config --quiet
      - run: docker build --check backend
      - run: docker build --check model
      - run: docker build --check --target production frontend
